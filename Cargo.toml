[package]
name = "kcensus"
version = "0.1.0"
edition = "2024"
default-run = "kcensus"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-serde = { version = "0.9", features = ["bincode"] }
serde = { version = "1.0", features = ["derive"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
clap = { version = "4.5.31", features = ["derive"] }
bit-set = { version = "0.8", features = ["serde"] }
tokio-stream = "0.1"
env_logger = "0.11"
log = "0.4.27"
petgraph = "0.7"
toml = "0.8.20"
chrono = "0.4"
tokio-timerfd = "0.2"
scylla = "1.1.0"
bincode = "1.3.3"
rand = "0.9.0"
rand_distr = "0.5.1"
serde_json = "1.0.140"
