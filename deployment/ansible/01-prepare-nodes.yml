---
- name: Prepare all nodes (Cassandra, Binaries)
  hosts: kcensus_nodes
  gather_facts: no
  strategy: free
  serial: 0
  tasks:
    - name: Wait for SSH to become available
      wait_for:
        host: "{{ inventory_hostname }}"
        port: 22
        state: started
      delegate_to: localhost

    - name: Start a Cassandra container
      community.docker.docker_container:
        name: "cassandra-{{ groups['kcensus_nodes'].index(inventory_hostname) + 1 }}"
        image: shotover/cassandra-test:5.0-rc1-r3
        state: started
        detach: yes
        restart_policy: always
        env:
          JVM_OPTS: "-Xms256M -Xmx1024M"
        ports:
          - "{{ 9041 + groups['kcensus_nodes'].index(inventory_hostname) + 1 }}:9042"

    - name: Create a directory for the application
      ansible.builtin.file:
        path: /home/ec2-user/kcensus_app
        state: directory
        mode: '0755'

    - name: Copy the kcensus binary
      ansible.builtin.copy:
        src: ../../target/x86_64-unknown-linux-musl/release/kcensus
        dest: /home/ec2-user/kcensus_app/kcensus
        mode: '0755'

    # Note: graph_bench is copied in its specific experiment

    - name: Wait for Cassandra to be ready
      ansible.builtin.shell: >
        docker exec cassandra-{{ groups['kcensus_nodes'].index(inventory_hostname) + 1 }} cqlsh -e "SELECT now() FROM system.local;"
      register: cassandra_status
      until: cassandra_status.rc == 0
      retries: 100
      delay: 1
      changed_when: false
