---
- name: Generate configurations for kcensus experiment
  hosts: kcensus_nodes
  gather_facts: no
  vars:
    master_config_path: "/tmp/master-config.json"

  tasks:
    - name: Generate dynamic region list
      run_once: true
      set_fact:
        dynamic_regions: "{{ groups['kcensus_nodes'] | map('extract', hostvars, 'aws_region') | list }}"

    - name: Start measuring all one-way latencies with ping
      ansible.builtin.shell: >
        sudo ping -c 500 -i 0.005 {{ item }} |
        grep 'icmp_seq' |
        grep -oP 'time=\K[0-9.]+' |
        sort -n |
        head -n -50 |
        tail -n +51 |
        awk '{ total += $1; count++ } END { if (count > 0) print total/count/2; else print "9999" }'
      async: 600
      poll: 0
      loop: "{{ groups['kcensus_nodes'] }}"
      register: async_jobs

    - name: Wait for all pings to be done
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ async_jobs.results }}"
      register: all_ping_results
      until: all_ping_results.finished
      retries: 600
      delay: 1

    - name: Assemble master configuration on the control node
      run_once: true
      delegate_to: localhost
      vars:
        node_list: "{{ groups['kcensus_nodes'] }}"
        master_config:
          nodes: |
            {%- set nodes = [] -%}
            {%- for i in range(node_list | length) -%}
            {%-   set host_ip = node_list[i] -%}
            {%-   set _ = nodes.append({
                    "global_id": i,
                    "ip": host_ip,
                    "region": hostvars[host_ip]['aws_region'],
                    "cassandra_port": 9042 + i
                  }) -%}
            {%- endfor -%}
            {{ nodes }}
          latency_matrix: |
            {%- set matrix = [] -%}
            {%- for i in range(node_list | length) -%}
            {%-   set source_host = node_list[i] -%}
            {%-   set row = [] -%}
            {%-   for j in range(node_list | length) -%}
            {%-     if i == j -%}
            {%-       set _ = row.append(0.0) -%}
            {%-     else -%}
            {%-       set ping_result = hostvars[source_host]['all_ping_results']['results'][j] -%}
            {%-       set latency = ping_result.stdout | float(9999.0) | round(2, 'floor') -%}
            {%-       set _ = row.append(latency) -%}
            {%-     endif -%}
            {%-   endfor -%}
            {%-   set _ = matrix.append(row) -%}
            {%- endfor -%}
            {{ matrix }}
      ansible.builtin.copy:
        dest: "{{ master_config_path }}"
        content: |
          {
            "nodes": {{ master_config.nodes | from_yaml | to_json }},
            "raw_latencies": {{ master_config.latency_matrix | from_yaml | to_json }}
          }

    - name: Generate sub-config and inventory for all nodes
      run_once: true
      delegate_to: localhost
      vars:
        all_regions: "{{ groups['kcensus_nodes'] | map('extract', hostvars, 'aws_region') | join(',') }}"
        sub_config_path: "/tmp/config-all.toml"
        sub_inventory_path: "/tmp/inventory-all.ini"
      ansible.builtin.shell: >
        python3 {{ playbook_dir }}/scripts/generate_sub_config.py
        --master-config {{ master_config_path }}
        --regions "{{ all_regions }}"
        --out-config {{ sub_config_path }}
        --out-inventory {{ sub_inventory_path }}
      args:
        chdir: "{{ playbook_dir }}"

    - name: Load generated sub-config for template variables
      run_once: true
      delegate_to: localhost
      ansible.builtin.slurp:
        src: "/tmp/config-all.toml"
      register: sub_config_content

    - name: Parse sub-config TOML content
      run_once: true
      delegate_to: localhost
      set_fact:
        sub_config_data: "{{ sub_config_content.content | b64decode | split('\n') }}"

    - name: Extract regions and latency matrix from sub-config
      run_once: true
      delegate_to: localhost
      set_fact:
        dynamic_regions: "{{ groups['kcensus_nodes'] | map('extract', hostvars, 'aws_region') | list }}"
        dynamic_latency_matrix: |
          {%- set matrix = [] -%}
          {%- set hosts = groups['kcensus_nodes'] -%}
          {%- for i in range(hosts | length) -%}
          {%-   set source_host = hosts[i] -%}
          {%-   set row = [] -%}
          {%-   for j in range(hosts | length) -%}
          {%-     if i == j -%}
          {%-       set _ = row.append(0.0) -%}
          {%-     else -%}
          {%-       set ping_result = hostvars[source_host]['all_ping_results']['results'][j] -%}
          {%-       set latency = ping_result.stdout | float(9999.0) | round(2, 'floor') -%}
          {%-       set _ = row.append(latency) -%}
          {%-     endif -%}
          {%-   endfor -%}
          {%-   set _ = matrix.append(row) -%}
          {%- endfor -%}
          {{ matrix }}

    - name: Create config.toml from template
      ansible.builtin.template:
        src: config.toml.j2
        dest: /home/ec2-user/kcensus_app/config.toml
        mode: '0644'