---
- name: Measure latencies in parallel
  hosts: kcensus_nodes
  gather_facts: no
  strategy: free
  tasks:
    - name: Generate dynamic region list
      run_once: true
      set_fact:
        dynamic_regions: "{{ groups['kcensus_nodes'] | map('extract', hostvars, 'aws_region') | list }}"

    - name: Create ping script on target host
      ansible.builtin.copy:
        dest: /tmp/ping_nodes.sh
        mode: '0755'
        content: |
          {% raw %}
          #!/usr/bin/env bash
          set -Eeuo pipefail

          readonly ping_count=50
          readonly ping_interval=0.2
          readonly batch_count=7
          readonly min_replies=45
          readonly trim_count=5
          readonly max_one_way_latency_ms=1000
          readonly source_host="$1"
          shift
          nodes=("$@")
          export ping_count ping_interval batch_count min_replies trim_count max_one_way_latency_ms source_host

          nodes_json=$(
            printf "%s\n" "${nodes[@]}" |
            xargs -P 100 -I{} bash -c '
              set -Eeuo pipefail
              n="$1"

              if [[ "$n" == "$source_host" ]]; then
                printf "\"%s\": 0.0\n" "$n"
                exit 0
              fi

              estimates=()

              for ((batch = 1; batch <= batch_count; batch++)); do
                if ! ping_output=$(sudo -n ping -n -c "$ping_count" -i "$ping_interval" "$n" 2>&1); then
                  printf "ping batch %s/%s to %s failed: %s\n" \
                    "$batch" "$batch_count" "$n" "$ping_output" >&2
                  exit 255
                fi

                rtts=$(printf "%s\n" "$ping_output" \
                  | sed -nE "s/.*time[=<]([0-9.]+).*/\1/p")
                replies=$(printf "%s\n" "$rtts" | sed "/^$/d" | wc -l)
                replies=${replies//[[:space:]]/}

                if (( replies < min_replies || replies > ping_count )); then
                  printf "ping batch %s/%s to %s had %s/%s usable replies; require at least %s\n" \
                    "$batch" "$batch_count" "$n" "$replies" "$ping_count" "$min_replies" >&2
                  exit 255
                fi

                estimate=$(printf "%s\n" "$rtts" \
                  | sort -n \
                  | head -n "-$trim_count" \
                  | tail -n "+$((trim_count + 1))" \
                  | awk "{ total += \$1; count++ }
                    END {
                      if (count == 0) exit 1
                      printf \"%.6f\", total / count / 2
                    }")

                if ! awk -v value="$estimate" -v max="$max_one_way_latency_ms" \
                  "BEGIN { exit !(value >= 0 && value <= max) }"; then
                  printf "implausible one-way latency for ping batch %s/%s to %s: %s ms\n" \
                    "$batch" "$batch_count" "$n" "$estimate" >&2
                  exit 255
                fi

                estimates+=("$estimate")
              done

              median_position=$((batch_count / 2 + 1))
              median=$(printf "%s\n" "${estimates[@]}" | sort -n | sed -n "${median_position}p")
              printf "\"%s\": %s\n" "$n" "$median"
            ' _ {} | paste -sd "," -)

          printf "{%s}\n" "$nodes_json"
          {% endraw %}

    - name: Run ping script
      ansible.builtin.command:
        argv: "{{ ['/tmp/ping_nodes.sh', inventory_hostname] + groups['kcensus_nodes'] }}"
      register: latencies
      changed_when: false

    - name: Report latencies
      ansible.builtin.debug:
        msg: "{{ (latencies.stdout | from_json) }}"

- name: Build configs on localhost
  hosts: kcensus_nodes
  gather_facts: no
  vars:
    master_config_path: "/tmp/master-config.json"
  tasks:
    - name: Assemble master configuration on the control node
      run_once: true
      delegate_to: localhost
      vars:
        node_list: "{{ groups['kcensus_nodes'] }}"
        master_config:
          nodes: |
            {%- set nodes = [] -%}
            {%- for i in range(node_list | length) -%}
            {%-   set host_ip = node_list[i] -%}
            {%-   set _ = nodes.append({
                    "global_id": i,
                    "ip": host_ip,
                    "region": hostvars[host_ip]['aws_region'],
                    "cassandra_port": 9042 + i
                  }) -%}
            {%- endfor -%}
            {{ nodes }}
          latency_matrix: |
            {%- set matrix = [] -%}
            {%- for i in range(node_list | length) -%}
            {%-   set source_host = node_list[i] -%}
            {%-   set row = [] -%}
            {%-   for j in range(node_list | length) -%}
            {%-     if i == j -%}
            {%-       set _ = row.append(0.0) -%}
            {%-     else -%}
            {%-       set ping_result = (hostvars[source_host].latencies.stdout | from_json)[node_list[j]] -%}
            {%-       set latency = ping_result | float(9999.0) | round(2, 'floor') -%}
            {%-       set _ = row.append(latency) -%}
            {%-     endif -%}
            {%-   endfor -%}
            {%-   set _ = matrix.append(row) -%}
            {%- endfor -%}
            {{ matrix }}
      ansible.builtin.copy:
        dest: "{{ master_config_path }}"
        content: |
          {
            "nodes": {{ master_config.nodes | from_yaml | to_json }},
            "raw_latencies": {{ master_config.latency_matrix | from_yaml | to_json }}
          }

    - name: Generate sub-config and inventory for all nodes
      run_once: true
      delegate_to: localhost
      vars:
        all_regions: "{{ groups['kcensus_nodes'] | map('extract', hostvars, 'aws_region') | join(',') }}"
        sub_config_path: "/tmp/config-all.toml"
        sub_inventory_path: "/tmp/inventory-all.ini"
      ansible.builtin.shell: >
        python3 {{ playbook_dir }}/scripts/generate_sub_config.py
        --master-config {{ master_config_path }}
        --regions "{{ all_regions }}"
        --out-config {{ sub_config_path }}
        --out-inventory {{ sub_inventory_path }}
      args:
        chdir: "{{ playbook_dir }}"

    - name: Load generated sub-config for template variables
      run_once: true
      delegate_to: localhost
      ansible.builtin.slurp:
        src: "/tmp/config-all.toml"
      register: sub_config_content

    - name: Parse sub-config TOML content
      run_once: true
      delegate_to: localhost
      set_fact:
        sub_config_data: "{{ sub_config_content.content | b64decode | split('\n') }}"

    - name: Extract regions and latency matrix from sub-config
      run_once: true
      delegate_to: localhost
      set_fact:
        dynamic_regions: "{{ groups['kcensus_nodes'] | map('extract', hostvars, 'aws_region') | list }}"
        dynamic_latency_matrix: |
          {%- set matrix = [] -%}
          {%- set hosts = groups['kcensus_nodes'] -%}
          {%- for i in range(hosts | length) -%}
          {%-   set source_host = hosts[i] -%}
          {%-   set row = [] -%}
          {%-   for j in range(hosts | length) -%}
          {%-     if i == j -%}
          {%-       set _ = row.append(0.0) -%}
          {%-     else -%}
          {%-       set ping_result = (hostvars[source_host].latencies.stdout | from_json)[groups['kcensus_nodes'][j]] -%}
          {%-       set latency = ping_result | float(9999.0) | round(2, 'floor') -%}
          {%-       set _ = row.append(latency) -%}
          {%-     endif -%}
          {%-   endfor -%}
          {%-   set _ = matrix.append(row) -%}
          {%- endfor -%}
          {{ matrix }}

# Generate toml on each host
- name: Generate toml on each host
  hosts: kcensus_nodes
  gather_facts: no
  strategy: free
  tasks:
    - name: Create config.toml from template
      ansible.builtin.template:
        src: config.toml.j2
        dest: /home/ec2-user/kcensus_app/config.toml
        mode: '0644'
