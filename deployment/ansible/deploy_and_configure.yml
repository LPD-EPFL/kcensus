# This playbook deploys the kcensus app, sets up Cassandra containers,
# and calculates latencies between servers to generate config files.

- name: Deploy binary and generate configuration files
  hosts: kcensus_nodes
  gather_facts: no

  tasks:
    - name: Ensure Cassandra container is running
      community.docker.docker_container:
        name: "cassandra-{{ groups['kcensus_nodes'].index(inventory_hostname) + 1 }}"
        image: cassandra:latest
        state: started
        detach: yes
        restart_policy: always
        env:
          JVM_OPTS: "-Xms256M -Xmx1024M"
        ports:
          - "{{ 9041 + groups['kcensus_nodes'].index(inventory_hostname) + 1 }}:9042"

    - name: Wait for Cassandra to be ready
      ansible.builtin.shell: >
        docker exec cassandra-{{ groups['kcensus_nodes'].index(inventory_hostname) + 1 }} cqlsh -e "SELECT now() FROM system.local;"
      register: cassandra_status
      until: cassandra_status.rc == 0
      retries: 50
      delay: 6

    - name: Create a directory for the application
      ansible.builtin.file:
        path: /home/ec2-user/kcensus_app
        state: directory
        mode: '0755'

    - name: Copy the compiled kcensus binary
      ansible.builtin.copy:
        src: ../../target/x86_64-unknown-linux-musl/release/kcensus
        dest: /home/ec2-user/kcensus_app/kcensus
        mode: '0755'

    - name: Generate dynamic region list # for the config file
      run_once: true # only run in 1 host
      set_fact:
        dynamic_regions: "{{ groups['kcensus_nodes'] | map('extract', hostvars, 'aws_region') | list }}"

    - name: Measure pairwise one-way latencies using ping
      ansible.builtin.shell: >-
        ping -c 100 -i 0.2 {{ item }} |
        grep 'icmp_seq' |
        grep -oP 'time=\K[0-9.]+' |
        sort -n |
        head -n -5 |
        tail -n +6 |
        awk '{ total += $1; count++ } END { if (count > 0) print total/count/2; else print "9999" }'
      loop: "{{ groups['kcensus_nodes'] }}"
      register: all_ping_results
      ignore_errors: true

    - name: Assemble latency matrix on the control node
      run_once: true
      delegate_to: localhost
      set_fact:
        dynamic_latency_matrix: >-
          {%- set matrix = [] -%}
          {%- set hosts = groups['kcensus_nodes'] -%}
          {%- for i in range(hosts | length) -%}
          {%-   set source_host = hosts[i] -%}
          {%-   set row = [] -%}
          {%-   for j in range(hosts | length) -%}
          {%-     if i == j -%}
          {%-       set _ = row.append(0.0) -%}
          {%-     else -%}
          {%-       set ping_result = hostvars[source_host]['all_ping_results']['results'][j] -%}
          {%-       set latency = ping_result.stdout | float(9999.0) | round(2, 'floor') -%}
          {%-       set _ = row.append(latency) -%}
          {%-     endif -%}
          {%-   endfor -%}
          {%-   set _ = matrix.append(row) -%}
          {%- endfor -%}
          {{ matrix }}

    - name: Create config.toml from template
      ansible.builtin.template:
        src: config.toml.j2
        dest: /home/ec2-user/kcensus_app/config.toml
        mode: '0644'

    - name: Read config.toml content
      delegate_to: "{{ groups['kcensus_nodes'][0] }}"
      run_once: true
      ansible.builtin.slurp:
        src: /home/ec2-user/kcensus_app/config.toml
      register: generated_config_file

    - name: Display config.toml content
      run_once: true
      ansible.builtin.debug:
        msg: "{{ generated_config_file.content | b64decode }}"