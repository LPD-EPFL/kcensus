---
- name: Run kcensus Experiment and Collect Results
  hosts: all
  gather_facts: no
  vars:
    # default values: will always be overriden
    algo: "kcensus"
    writes: "1"
    duration: "10s"
    ingress: "exponential"
    throughput: "10"
    speedup: "1"
    faults: ""
    keys: "100"
    skew: "0"
    shards: "100"
    nonvoting: ""
    conflicts: ""
    result_path: "./results_default"
    # Where the output of a failed attempt is kept so a saturation or bug can be investigated
    # afterwards. Without this a failing run left no logs at all: the shell task marked the host
    # failed and Ansible skipped the save, and the retry then overwrote nothing.
    failed_path: ""

  tasks:
    - name: Set sub_exp_id for regular inventory (fallback to host index)
      set_fact:
        sub_exp_id: "{{ sub_exp_id | default(groups['kcensus_nodes'].index(inventory_hostname) if 'kcensus_nodes' in groups else groups['all'].index(inventory_hostname)) }}"
        cassandra_port: "{{ cassandra_port | default(9041 + (groups['kcensus_nodes'].index(inventory_hostname) if 'kcensus_nodes' in groups else groups['all'].index(inventory_hostname)) + 1) }}"

    # `failed_when: false` keeps every host in the play whatever kcensus returns, so the save
    # tasks below always run. The play is failed explicitly at the end instead.
    - name: Run kcensus
      ansible.builtin.shell:
        cmd: >
          RUST_BACKTRACE=1
          timeout {{ 30 + 3 * (duration | regex_replace('s$', '') | int) }}s
          /usr/bin/time -f '[log=time] peak process memory (KiB): %M | {"memory": %M}'
          ./kcensus --config config.toml -p {{ sub_exp_id }}
          -a "{{ algo }}"
          -w "{{ writes }}"
          --duration "{{ duration }}"
          -i "{{ ingress }}"
          -t "{{ throughput }}"
          -s "{{ speedup }}"
          -k "{{ keys }}"
          --skew "{{ skew }}"
          --shards "{{ shards }}"
          {{ "-v " + nonvoting if nonvoting else "" }}
          {{ "-f " + faults if faults else "" }}
          {{ "--conflicts=" + conflicts if conflicts else "" }}
        chdir: /home/ec2-user/kcensus_app
      register: job_result
      failed_when: false

    - name: Save output from each server
      delegate_to: localhost
      ansible.builtin.copy:
        dest: "{{ result_path }}/server_{{ sub_exp_id }}.log"
        content: |
          STDOUT:
          {{ job_result.stdout | default('NO STDOUT CAPTURED') }}

          STDERR:
          {{ job_result.stderr | default('NO STDERR CAPTURED') }}

    # `copy` does not create its destination directory. `result_path` is made by the runner
    # before the play; `failed_path` is not, because it only applies to runs that fail -- so
    # without this the save below fails on exactly the runs it exists to capture.
    - name: Create the failed-run directory
      delegate_to: localhost
      run_once: true
      when:
        - failed_path | length > 0
        - ansible_play_hosts | map('extract', hostvars, 'job_result')
          | map(attribute='rc') | reject('equalto', 0) | list | length > 0
      ansible.builtin.file:
        path: "{{ failed_path }}"
        state: directory
        mode: "0755"

    - name: Keep every server's output when any server failed
      delegate_to: localhost
      when:
        - failed_path | length > 0
        - ansible_play_hosts | map('extract', hostvars, 'job_result')
          | map(attribute='rc') | reject('equalto', 0) | list | length > 0
      ansible.builtin.copy:
        dest: "{{ failed_path }}/server_{{ sub_exp_id }}.log"
        content: |
          EXIT CODE: {{ job_result.rc | default('unknown') }}

          STDOUT:
          {{ job_result.stdout | default('NO STDOUT CAPTURED') }}

          STDERR:
          {{ job_result.stderr | default('NO STDERR CAPTURED') }}

    - name: Fail if this server's run failed
      ansible.builtin.fail:
        msg: >-
          kcensus exited {{ job_result.rc }} on {{ inventory_hostname }} (pid {{ sub_exp_id }}){{
          '; output kept in ' + failed_path if failed_path | length > 0 else '' }}
      when: job_result.rc != 0
