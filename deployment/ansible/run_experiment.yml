- name: Play 1 - Start Experiments Sequentially # test experiment
  hosts: kcensus_nodes
  gather_facts: no
  order: inventory
  serial: 1

  tasks:
    - name: Start kcensus process in the background
      ansible.builtin.shell:
        cmd: >
          /usr/bin/time -f "[time] Memory(KB): %M" 
          ./kcensus --config config.toml -a k-census -w 1 -r 100 -p {{ groups['kcensus_nodes'].index(inventory_hostname) }}
        chdir: /home/ec2-user/kcensus_app
      async: 7200
      poll: 0
      register: kcensus_async_start

    - name: Print async job ID for reference
      ansible.builtin.debug:
        msg: "Started kcensus on {{ inventory_hostname }} with Job ID {{ kcensus_async_start.ansible_job_id }}"


- name: Play 2 - Wait For Experiments to Finish
  hosts: kcensus_nodes
  gather_facts: no

  tasks:
    - name: Wait for kcensus process on this host to finish
      ansible.builtin.async_status:
        jid: "{{ hostvars[inventory_hostname]['kcensus_async_start'].ansible_job_id }}"
      register: job_result
      until: job_result.finished
      retries: 600
      delay: 12


- name: Play 3 - Save Individual Results Locally
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:
    - name: Create local results directory
      ansible.builtin.file:
        path: ./results
        state: directory
        mode: '0755'
      run_once: true

    - name: Save output for each server to a separate file
      ansible.builtin.copy:
        dest: "./results/server_{{ groups['kcensus_nodes'].index(item) }}.log"
        content: |
          ---
          Host: {{ item }}
          ID: {{ groups['kcensus_nodes'].index(item) }}
          ---

          STDOUT:
          {{ hostvars[item]['job_result'].stdout | default('NO STDOUT CAPTURED') }}

          STDERR:
          {{ hostvars[item]['job_result'].stderr | default('NO STDERR CAPTURED') }}
      loop: "{{ groups['kcensus_nodes'] }}"
      loop_control:
        label: "{{ item }}"

    - name: Display final message
      ansible.builtin.debug:
        msg: "All experiment results have been saved individually in the ./results/ directory."
      run_once: true